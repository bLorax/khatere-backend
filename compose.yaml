services:
  postgres:
    image: postgres:17-alpine
    container_name: khatere-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: yadegar_user
      POSTGRES_PASSWORD: yadegar_user
      POSTGRES_DB: yadegar
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yadegar_user -d yadegar"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: khatere
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://yadegar_user:yadegar_user@postgres:5432/yadegar?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8080:8080"
    volumes:
      - ./uploads:/app/uploads

volumes:
  postgres_data:
